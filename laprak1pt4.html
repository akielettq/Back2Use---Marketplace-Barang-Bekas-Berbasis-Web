<!DOCTYPE html>
<html lang="id">
<head>
    <title>Buat Laprak 1</title>
</head>
<body>
<main>
    <section id="album">
        <h2>Album Slipknot</h2>
        <table border="1">
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Tahun Keluar</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Slipknot</td>
                <td>1999</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Iowa</td>
                <td>2001</td>
            </tr>
        </table>
    </section>
<section id="metal">
    <h2>Mana Album Favoritmu?</h2>
    <form>
        <input type="radio" id="slipknot" name="fav_album" value="Slipknot">
        <label for="slipknot">Slipknot</label><br>
        <input type="radio" id="iowa" name="fav_album" value="Iowa">
        <label for="iowa">Iowa</label><br>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</section>
</main>
</body>
</html>
